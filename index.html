    <!-- OVERLAY DRAG & DROP FILE (MUNCUL OTOMATIS SAAT USER MENARIK FILE) -->

        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amartha-50 text-amartha-700 border border-purple-200">

  <!-- FLOATING TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    const iframe = document.getElementById('appIframe');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loaderBar = document.getElementById('loaderBar');
    const dragDropOverlay = document.getElementById('dragDropOverlay');

    // Progress bar dinamis saat loading
    let progress = 25;
    const progressInterval = setInterval(() => {
      if (progress < 90) {
        progress += 15;
        if (loaderBar) loaderBar.style.width = progress + '%';
      }
    }, 280);

    // Saat iframe Google Apps Script selesai dimuat
    function onIframeLoaded() {
      clearInterval(progressInterval);
      if (loaderBar) loaderBar.style.width = '100%';

      // Menghilangkan loading screen secara mulus
      setTimeout(() => {
        if (loadingOverlay) {
          loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(() => {
            loadingOverlay.style.display = 'none';
          }, 700);
        }
      }, 400);
    }

    // DRAG AND DROP FILE HANDLER (DI SELURUH LAYAR)
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (e.dataTransfer && e.dataTransfer.types.includes('Files')) {
        dragDropOverlay.classList.remove('opacity-0', 'pointer-events-none');
        dragDropOverlay.classList.add('opacity-100');
      }
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dragDropOverlay.classList.remove('opacity-100');
        dragDropOverlay.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dragDropOverlay.classList.remove('opacity-100');
      dragDropOverlay.classList.add('opacity-0', 'pointer-events-none');

      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const files = e.dataTransfer.files;
        for (let i = 0; i < files.length; i++) {
          triggerFileDownload(files[i]);
        }
        showToast('success', `${files.length} berkas berhasil diterima & disimpan ke unduhan browser.`);
      }
    });

    // Otomatis mengunduh berkas yang di-drop ke folder unduhan browser
    function triggerFileDownload(file) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // LISTENER UNDUHAN DARI GOOGLE APPS SCRIPT (POSTMESSAGE)
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'DOWNLOAD_FILE') {
        const { fileName, base64Data, mimeType } = event.data;
        const linkSource = `data:${mimeType || 'application/octet-stream'};base64,${base64Data}`;
        const downloadLink = document.createElement('a');
        downloadLink.href = linkSource;
        downloadLink.download = fileName || 'Amartha-Report.xlsx';
        downloadLink.click();
        showToast('success', `Berhasil mengunduh: ${fileName}`);
      }
    });

    // SISTEM NOTIFIKASI TOAST (TANPA MENGGUNAKAN ALERT)
    function showToast(type, message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all duration-300 transform translate-y-2 opacity-0 max-w-sm bg-amartha-800 border border-purple-400';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-purple-300 text-sm"></i> <span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 350);
      }, 4000);
    }
  </script>
